name: CI — Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Unit Test + PG17 Migration + API Smoke)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: funniest_outdoor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d funniest_outdoor_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 5173
      DATABASE_URL: postgresql://postgres:ci_password@127.0.0.1:5432/funniest_outdoor_test
      DATABASE_SSL: "false"
      JWT_SECRET: ci-test-secret-minimum-32-characters-long
      CORS_ORIGIN: http://localhost:5174

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm test

      - name: Run PostgreSQL migration & seed (pgvector + pg_trgm)
        working-directory: backend
        run: npm run db:setup

      - name: Run live API integration smoke test
        working-directory: backend
        run: |
          node --input-type=module -e "
            import { createApp } from './src/app.js';
            import { pool } from './src/config/db.js';
            const app = createApp();
            const srv = app.listen(0, '127.0.0.1', async () => {
              const { port } = srv.address();
              const base = 'http://127.0.0.1:' + port;
              try {
                const health = await fetch(base + '/api/health').then(r => r.json());
                if (health.db !== 'connected') throw new Error('DB not connected: ' + JSON.stringify(health));

                const boot = await fetch(base + '/api/bootstrap').then(r => r.json());
                if (!boot.items?.length || boot.bundles?.length !== 3) {
                  throw new Error('Unexpected bootstrap payload');
                }

                const search = await fetch(base + '/api/search', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ query: 'tnda campng 4p' })
                }).then(r => r.json());
                if (!search.ids?.includes('tenda-dome-4p')) {
                  throw new Error('Typo-tolerant fallback search failed: ' + JSON.stringify(search));
                }

                const rec = await fetch(base + '/api/recommend', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ item_ids: ['tenda-dome-4p'] })
                }).then(r => r.json());
                if (!rec.ids?.length || rec.ids.includes('tenda-dome-2p')) {
                  throw new Error('Recommend should return complementary non-tent gear: ' + JSON.stringify(rec));
                }

                console.log('CI_INTEGRATION_OK', {
                  items: boot.items.length,
                  bundles: boot.bundles.length,
                  searchHits: search.ids.length,
                  recommendIds: rec.ids
                });
              } catch (err) {
                console.error(err);
                process.exitCode = 1;
              } finally {
                srv.close(async () => {
                  await pool.end();
                });
              }
            });
          "

  frontend:
    name: Frontend (Vite Production Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Verify build output exists
        run: test -f frontend/dist/client/index.html

  ai-service:
    name: AI Service (FastAPI Check — auto-enabled when ai-service/ exists)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if ai-service exists
        id: check
        run: |
          if [ -f "ai-service/requirements.txt" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Folder ai-service/ belum ada — melewati pengecekan Python."
          fi

      - name: Setup Python 3.11
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install & syntax-check AI service
        if: steps.check.outputs.exists == 'true'
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          python -m compileall .
          if [ -d "tests" ]; then pytest; fi
